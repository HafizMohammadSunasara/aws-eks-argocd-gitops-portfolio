<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="GitHub Actions CI publishes SHA image to Amazon ECR, review PR updates Git, Argo CD reconciles Amazon EKS, browser accesses ClusterIP via local port forward">
